services:
  db:
    image: postgres:16-alpine
    container_name: content-engine-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_engine
    ports:
      - "5432:5432"
    volumes:
      - content_engine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  content_engine_pgdata:
